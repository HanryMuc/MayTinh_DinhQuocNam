<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiTech Store - Đinh Quốc Nam</title>
    <!-- CSS từ CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Link file CSS cá nhân -->
    <link rel="stylesheet" href="demo.css">
</head>
<body>

    <header class="bg-dark-custom pt-4">
        <div class="container">
            <div class="logo mb-4">
                <img src="logo.png" alt="Logo" class="img-fluid">
            </div>
        </div>
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-orange">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active fw-bold" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="#">Appliances</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="#">Computers</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="#">Contact Us</a></li>
                    </ul>
                    <div class="cart-info text-white">
                        <i class="fas fa-shopping-cart"></i> 0 ITEM(S)
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="hero-section bg-dark-custom text-white py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-4 orange-text fw-bold">Pick your best product</h1>
                    <p class="text-muted">Vivamus vitae augue at quam fringilla tristique sit amet acin ante sikumpre tisdin.</p>
                    <button class="btn btn-secondary-custom mt-3">SHOP NOW</button>
                </div>
                <div class="col-md-6 text-center">
                    <img src="slider-img.png" alt="Hero Product" class="img-fluid">
                </div>
            </div>
        </div>
    </section>

    <main class="bg-light-custom py-5">
        <div class="container">
            <div class="category-header bg-dark text-white p-2 mb-4">
                <h5 class="m-0 ms-2">Browse All Categories</h5>
            </div>

            <div class="row g-4">
                <!-- Sản phẩm mẫu -->
                <div class="col-md-3">
                    <div class="card h-100 border-0 shadow-sm text-center p-3">
                        <p class="product-title orange-text">Whirlpool LTE5243D 3.4</p>
                        <div class="product-img-container my-3">
                            <img src="product-img1.jpg" class="img-fluid" alt="Sản phẩm">
                        </div>
                        <hr>
                        <h4 class="fw-bold">$839.93</h4>
                        <button class="btn btn-secondary-custom btn-sm w-75 mx-auto">Add to cart</button>
                    </div>
                </div>
                <!-- Bạn có thể copy thêm các cột col-md-3 cho các sản phẩm khác -->
            </div>
        </div>
    </main>

    <footer class="bg-orange text-white text-center py-3 position-relative">
        <div class="container">
            <p class="m-0 small">&copy; 2026 | Đinh Quốc Nam - 25211TT2459</p>
            <div class="scroll-top" id="backToTop">
                <i class="fas fa-chevron-up"></i>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('backToTop').addEventListener('click', function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    </script>
</body>
</html>
